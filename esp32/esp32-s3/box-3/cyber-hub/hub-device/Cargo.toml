[package]
edition      = "2024"
name         = "cyber-hub"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "cyber-hub"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["defmt", "esp32s3", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }

embassy-net = { version = "0.7.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "dns",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.6.1", features = ["defmt-03"] }
embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }

# === Phase 2 硬件外设驱动 ===
embedded-graphics = "0.8.1"
mipidsi = "0.8.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
icm42670 = "0.2.0"
accelerometer = "0.12.0"
embedded-hal-bus = "0.2.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.6.0"
embassy-futures = "0.1.1"
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
sht4x = "0.2.0"

esp-backtrace = { version = "0.14", features = ["esp32s3", "panic-handler", "defmt"] }
esp-println = { version = "0.11", features = ["esp32s3", "log"] }

esp-alloc = { version = "0.9.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "0.17.0", features = [
  "defmt",
  "esp-alloc",
  "esp32s3",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
