[package]
name = "cyber-hub-std"
version = "0.1.0"
authors = ["Gustaf"]
edition = "2021"
resolver = "2"
rust-version = "1.77"
default-run = "cyber-hub-std"

[features]
default = ["std", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.52", default-features = false }
esp-idf-sys = { version = "0.37" }
esp-idf-hal = { version = "0.46" }
embedded-graphics = "0.8.1"
mipidsi = "0.8.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
anyhow = "1.0"
icm42670 = "0.2.0"
accelerometer = "0.12.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
dotenvy = "0.15"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-sr", version = "^2.0.0" }
bindings_header = "components/esp_sr/bindgen.h"
bindings_module = "esp_sr"
