[package]
name = "hub-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-openai = "0.27"
dotenv = "0.15"
anyhow = "1"
bytes = "1"
hound = "3"
cpal = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
