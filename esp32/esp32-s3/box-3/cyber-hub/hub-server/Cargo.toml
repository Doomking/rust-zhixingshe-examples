[package]
name = "hub-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-openai = "0.27"
dotenv = "0.15"
anyhow = "1"
bytes = "1"
hound = "3"
cpal = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sysinfo = "0.33"
whisper-rs = { version = "0.16", features = ["metal"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect"] }
url = "2"
indicatif = "0.17"
futures-util = "0.3"
once_cell = "1"
