[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架与异步运行时
axum = { version = "0.7", features = ["ws"] }               # 开启 WebSocket 支持
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] } # 处理跨域和静态文件
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
reqwest = { version = "0.11", features = ["blocking"] }
flate2 = "1.0"
tar = "0.4"
msedge-tts = "0.3"

# AI 推理引擎 (Candle)
candle-core = { version = "0.9.1", features = ["metal", "accelerate"] }
candle-transformers = "0.9.1"
candle-nn = { version = "0.9.1", features = ["metal"] }
hf-hub = "0.3.2"                                                        # 模型下载与缓存
tokenizers = { version = "0.19.1", features = ["http"] }                # 分词器

# 图像处理与后期排版
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"   # 用于在图片上渲染中文字体 (imageproc compatible)

# 日志与工具
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
dunce = "1.0.5"
