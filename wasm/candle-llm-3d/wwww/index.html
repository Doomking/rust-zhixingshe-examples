<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Digital Human | Rust Candle Engine</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/renderers/webgpu/WebGPURenderer.js": "https://unpkg.com/three@0.160.0/examples/jsm/renderers/webgpu/WebGPURenderer.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="canvas-container"></div>

    <div id="loading-screen">
      <div class="loader-content">
        <div class="spinner"></div>
        <h2 id="loading-text">INITIALIZING ...</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="sub-text">Loading Qwen LLM & 3D Assets</p>
      </div>
    </div>

    <div id="ui-layer" class="hidden">
      <div class="status-bar">
        <span id="model-status">3D 智能伴侣</span>
      </div>

      <div class="chat-container">
        <div class="chat-header">
          <span class="avatar-icon">
            <img src="./assets/image/avatar.png" alt="Avatar" />
          </span>
          <div class="header-info">
            <h3>Qwen-0.5B</h3>
          </div>
        </div>

        <div id="chat-history" class="chat-history">
          <div class="message ai-message">
            <div class="message-content">
              你好！我是运行在你浏览器里的 3D
              智能助手。没有任何数据会上传到服务器，我们可以聊聊吗？
            </div>
          </div>
        </div>

        <div class="input-area">
          <input
            type="text"
            id="userInput"
            placeholder="输入消息... (Enter 发送)"
            autocomplete="off"
          />
          <button id="sendBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
