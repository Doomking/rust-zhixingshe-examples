<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rust Wasm AI 情绪中枢</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <canvas id="particle-canvas"></canvas>

        <div class="container">
            <h2 class="neon-title">AI 情绪中枢 <small>Rust + Candle + Wasm</small></h1>

            <div id="loading-screen">
                <div class="loader"></div>
                <p id="status-text">正在初始化...</p>
            </div>

            <div id="main-content" class="hidden">
                <div class="input-wrapper">
                    <div
                        id="user-input-container"
                        contenteditable="true"
                        spellcheck="false"
                    ></div>
                </div>

                <div class="viz-container">
                    <div class="thermometer-group">
                        <div class="thermometer-score" id="neg-thermometer-score"></div>
                        <div class="thermometer">
                            <div id="neg-mercury" class="mercury neg"></div>
                        </div>
                        <label class="neon-red">负面</label>
                    </div>
                    <div class="thermometer-group">
                        <div class="thermometer-score" id="neu-thermometer-score"></div>
                        <div class="thermometer">
                            <div id="neu-mercury" class="mercury neu"></div>
                        </div>
                        <label
                            style="
                                color: #a855f7;
                                text-shadow: 0 0 10px #a855f7;
                            "
                            >中性</label
                        >
                    </div>
                    <div class="thermometer-group">
                        <div class="thermometer-score" id="pos-thermometer-score"></div>
                        <div class="thermometer">
                            <div id="pos-mercury" class="mercury pos"></div>
                        </div>
                        <label class="neon-blue">正面</label>
                    </div>
                </div>

                <div id="heatmap-strip" class="heatmap-strip"></div>
                <p id="stats-text">已就绪</p>
                <div class="test-cases-container">
                    <p class="section-label">情绪压力测试集</p>
                    <div id="test-tags" class="test-tags"></div>
                </div>
            </div>
        </div>
        <script type="module" src="main.js"></script>
    </body>
</html>
